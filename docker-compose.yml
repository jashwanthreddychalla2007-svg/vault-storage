version: '3.8'

services:
  vault-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vault-storage-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
